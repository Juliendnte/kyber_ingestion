[project]
name = "kyber-ingestion"
version = "0.1.0"
description = "Pipeline de données KyberIA : collecte, transformation, stockage, publication HF Hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "huggingface-hub>=0.26.0",
    "datasets>=3.1.0",
    "yt-dlp>=2024.11.4",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
